# Groundwork Demo Mode fixture pack (§23 of IMPLEMENTATION_PLAN.md).
#
# Six fictional B2B companies. Every entry here is EVIDENCE, not a verdict —
# no company has a `score` or `status` field. The engine computes every
# score, status, duplicate flag and review verdict at run time from the
# sources, structured facts and (for Northwind/Quarry) scripted provider
# failures below.
#
# DEMO_FIXTURE evidence never carries an http(s) source_url — structurally
# enforced by groundwork.models.schemas.Evidence, and asserted for every
# fixture row in tests/test_fixture_provenance.py.

play_spec:
  objective_text: >
    Find AI infrastructure startups that recently raised funding or are
    expanding their GTM teams. Identify the most relevant sales leader,
    score each company against our ICP, explain the evidence, and draft
    personalized outreach.
  target_industries: [ai_infrastructure]
  excluded_industries: [retail_pos]
  adjacent_industries:
    data_tooling: [ai_infrastructure]
  size_band_min: 50
  size_band_max: 250
  target_funding_stages: [series_a, series_b]
  target_technologies: [kubernetes, pytorch, triton]
  persona_titles: ["VP of Sales", "Head of Sales", "VP of Revenue"]
  min_score: 60
  min_confidence: 0.6
  target_count: 7

companies:
  # 1. Northwind Labs — the happy path, in full depth, plus a transient
  #    research-provider retry that succeeds on the second attempt.
  - slug: northwind-labs
    name: Northwind Labs
    domain: northwindlabs.com
    industry: ai_infrastructure
    size_band: "51-200"
    employee_count: 140
    hq_country: US
    description: Real-time inference infrastructure for production ML models.
    sources:
      - ref: funding-note
        title: Northwind Labs closes Series B
        claim: "Northwind Labs raised a $42M Series B"
        snippet: >
          Northwind Labs today announced it has closed a $42M Series B
          financing round led by Alluvium Partners to scale its real-time
          inference infrastructure. Northwind Labs operates in the ai
          infrastructure industry and has approximately 140 employees.
        signal_type: FUNDING
        confidence: 0.92
      - ref: hiring-note
        title: Northwind Labs GTM hiring surge
        claim: "Northwind Labs is hiring a VP of Sales, an Enterprise Account Executive, and an SDR Team Lead"
        snippet: >
          Northwind Labs has posted openings for a VP of Sales, an Enterprise
          Account Executive, and an SDR Team Lead as it builds out its
          go-to-market organization.
        signal_type: HIRING
        confidence: 0.88
      - ref: tech-note
        title: Northwind Labs engineering stack
        claim: "Northwind Labs' inference stack runs on Kubernetes, PyTorch, and Triton"
        snippet: >
          Northwind Labs' inference platform is built on Kubernetes, PyTorch,
          and NVIDIA Triton Inference Server.
        signal_type: TECH
        confidence: 0.83
      - ref: leadership-note
        title: Northwind Labs names VP of Sales
        claim: "Priya Natarajan is Northwind Labs' VP of Sales"
        snippet: >
          Priya Natarajan joined Northwind Labs as VP of Sales to lead its
          enterprise go-to-market motion.
        signal_type: LEADERSHIP
        confidence: 0.90
    funding_events:
      - stage: series_b
        amount_usd: 42000000
        announced_days_ago: 60
        source_ref: funding-note
    hiring_roles:
      - title: VP of Sales
        is_gtm: true
        posted_days_ago: 20
        source_ref: hiring-note
      - title: Enterprise Account Executive
        is_gtm: true
        posted_days_ago: 18
        source_ref: hiring-note
      - title: SDR Team Lead
        is_gtm: true
        posted_days_ago: 15
        source_ref: hiring-note
    tech_mentions:
      - name: kubernetes
        source_ref: tech-note
      - name: pytorch
        source_ref: tech-note
      - name: triton
        source_ref: tech-note
    leadership:
      - full_name: Priya Natarajan
        title: VP of Sales
        is_persona_match: true
        source_ref: leadership-note
    failure_script:
      research: { fail_attempts: 1, error: ProviderTimeout }
    industry_profile_source_ref: funding-note
    employee_profile_source_ref: funding-note

