[project]
name = "groundwork"
version = "0.1.0"
description = "Groundwork API — agentic GTM research and qualification engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "openai==3.6.0",
    "tldextract>=5.3.2",
    "tavily-python==0.8.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "itsdangerous>=2.2.0",
    "idna>=3.7",
    # V2-G: Fernet symmetric encryption for the Gmail refresh token at rest
    # (`groundwork/token_crypto.py`) — same posture as `SESSION_SIGNING_KEY`,
    # an env-held key rather than an external KMS (Part 11).
    "cryptography>=43.0.0",
    # V2-D: `providers/live/tavily_search.py`/`search_runtime.py` already
    # used httpx directly in production code, reaching it only transitively
    # via `tavily-python`'s own dependency — `providers/live/
    # apollo_enrichment.py`/`enrichment_runtime.py` now depend on it
    # directly (there is no Apollo SDK), so it's promoted to a direct
    # dependency rather than staying an implicit transitive one.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundwork"]
